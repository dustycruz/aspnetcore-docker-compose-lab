# Docker's embedded DNS server. Re-resolving "api" every 10 seconds means Nginx follows the
# API container when it is recreated (new IP) or scaled (docker compose up --scale api=2).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream myapi {
    zone myapi 64k;
    # "api" is the Compose service name. The "resolve" parameter requires nginx 1.27.3 or later.
    server api:8080 resolve;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass         http://myapi;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
    }

    # Lets Compose check that Nginx itself is up without involving the API.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
